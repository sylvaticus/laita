# Everything that can be checked without a human, checked on every push.
#
# The point is not ceremony. This repository's hard-won rules - never trust the model's
# view of the text, never let model output become markup, never read a password field -
# were written down in CLAUDE.md and then violated three times, because prose does not
# fail a build. These jobs are those rules made executable.
#
# Chrome and Firefox integration are deliberately absent: Chrome 137+ refuses
# --load-extension, and the Firefox harness needs a real browser and several minutes.
# browser/test/browser/run-harness.sh is run by hand before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # `npm ci` installs exactly what package-lock.json pins. Not `npm install`: the
      # whole reason the lockfile is committed is that "web-ext lint reports 0 warnings"
      # is meaningless when web-ext is whatever was published this morning.
      - run: npm ci
      - run: browser/test/run.sh
      - run: vscode/test/run.sh

  lint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  webext:
    name: web-ext lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # From inside browser/: web-ext reads web-ext-config.cjs from the CURRENT directory,
      # not from --source-dir, so running this at the repository root silently ignores
      # ignoreFiles and lints test/ and tools/ as if they were shipped.
      - run: npx web-ext lint --self-hosted
        working-directory: browser
      # dist-chrome/ is deliberately NOT linted here: web-ext validates against the Firefox
      # spec, so a Chrome manifest fails by design - BACKGROUND_SERVICE_WORKER_NOFALLBACK
      # and ADDON_ID_REQUIRED. test/unit/dist-chrome.test.mjs checks that package instead.

  build:
    name: the generated packages assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # dist-chrome/ and vscode/core/ are not in the repository. The unit tests generate
      # them and check the result, so this job only has to prove the packages themselves
      # assemble - which the tests never attempt.
      - run: browser/tools/build-chrome.sh
      - run: npx web-ext build --overwrite-dest
        working-directory: browser
      - run: |
          cd browser/dist-chrome
          zip -qr ../web-ext-artifacts/laita-chrome-ci.zip . -x '.*'
      - run: vscode/tools/sync-core.sh
      - run: npx --yes @vscode/vsce package --no-dependencies --out /tmp/ci.vsix
        working-directory: vscode
      - name: name them after the version, not after the run
        run: |
          V=$(node -p "require('./browser/manifest.json').version")
          mkdir -p packages
          cp browser/web-ext-artifacts/laita-firefox-*.zip "packages/laita-firefox-$V.zip"
          mv browser/web-ext-artifacts/laita-chrome-ci.zip "packages/laita-chrome-$V.zip"
          mv /tmp/ci.vsix "packages/laita-vscode-$V.vsix"
          ls -la packages/

      # So an unreleased build can be tested without building anything. Kept for 14 days:
      # these are for trying a commit, not for distributing - releases are permanent.
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*
          retention-days: 14
          if-no-files-found: error
